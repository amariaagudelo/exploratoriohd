# .github/workflows/hugo.yml
name: Deploy Hugo site to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O hugo.deb https://github.com/gohugoio/hugo/releases/download/v0.141.0/hugo_extended_0.141.0_linux_amd64.deb
          sudo dpkg -i hugo.deb
      
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --- ¡AQUÍ ESTÁ LA SOLUCIÓN! ---
      - name: Install Unzip
        run: sudo apt-get install -y unzip
      
      - name: Download and Unzip Congo Theme
        run: |
          wget https://github.com/jpanther/congo/archive/refs/tags/v2.12.2.zip
          unzip v2.12.2.zip
          mkdir -p themes
          mv congo-2.12.2 themes/congo
      
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4